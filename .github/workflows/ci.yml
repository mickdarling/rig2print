name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run repository checks and unit tests
        run: python scripts/check.py

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85.0', stable]
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action revision
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Check Clippy warnings
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked

  blender:
    name: Blender rig integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y blender
          blender --version
      - name: Inspect the pinned pre-rigged Ferris asset
        run: python3 scripts/inspect_ferris_ci.py
      - name: Prototype a captive knee from the actual Ferris rig
        run: |
          blender --background --factory-startup --disable-autoexec build/ferris/source.blend \
            --python-exit-code 1 --python scripts/prototype_joint.py -- \
            --mesh leg1L --armature Armature --parent-bone UpperLeg1.L --child-bone LowerLeg1.L \
            --span-mm 150 --output-dir build/ferris/knee-prototype
      - name: Preserve rig evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-evidence
          path: build/ferris/
          if-no-files-found: error

  required:
    name: CI passed
    if: ${{ always() }}
    needs: [checks, rust, blender]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every language check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BLENDER_RESULT: ${{ needs.blender.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$RUST_RESULT" != "success" ] || [ "$BLENDER_RESULT" != "success" ]; then
            echo "Checks did not all pass: Python=$CHECKS_RESULT Rust=$RUST_RESULT Blender=$BLENDER_RESULT"
            exit 1
          fi
